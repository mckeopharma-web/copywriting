nciples of good AI practice in drug development',url:'https://www.ema.europa.eu/en/documents/other/guiding-principles-good-ai-practice-drug-development_en.pdf',ctx:'Technologies IA générant ou analysant des preuves sur le cycle de vie du médicament.',period:'Janvier 2026 · page EMA mise à jour le 14 août 2026',metric:'Objet normatif : validation proportionnée au risque, provenance/documentation, interaction humain‑IA, suivi du cycle de vie.',boundary:'Principes normatifs de bonne pratique. Ne prouvent ni efficacité clinique, ni gain commercial, ni que toute feature HealthTech relève de ce périmètre.',score:'Factfulness 100/100 · EU judge 94/100'},{n:2,id:'EU-CANON-EHDS-EHR-TESTING-2026',cid:'claim-ehds-testing',claim:'Pour les systèmes EHR dans le périmètre EHDS, les composants harmonisés doivent être testés avant mise sur le marché et les résultats d’évaluation intégrés à la documentation technique.',title:'Commission européenne — EHDS Platform / EHR testing environment',url:'https://health.ec.europa.eu/ehealth-digital-health-and-care/ehds-action/ehds-platform_en',ctx:'Fabricants de systèmes EHR et composants EHR harmonisés entrant dans le périmètre EHDS.',period:'Page d’implémentation vérifiée en septembre 2026',metric:'Objet normatif : test avant mise sur le marché et résultats d’évaluation dans la documentation technique.',boundary:'Exigence limitée aux EHR concernés. Ne s’applique pas automatiquement aux autres logiciels et ne mesure aucun gain de performance.',score:'Factfulness 100/100 · EU judge 94/100'}];const N=s=>(s||'').replace(/\s+/g,' ').trim(),els=(r=document)=>[...r.querySelectorAll('h1,h2,h3,h4,p,li,dt,dd,strong,span')],find=(r,t)=>els(r).find(x=>N(x.textContent)===N(t)),sec=t=>{const e=els().find(x=>N(x.textContent).includes(t));return e&&e.closest('section')},rep=(r,a,b)=>{const e=find(r,a);if(e)e.textContent=b;return e},after=(a,b)=>a&&a.parentNode.insertBefore(b,a.nextSibling);function bubble(e){const p=document.createElement('p');p.className='euc';const s=document.createElement('span');s.id=e.cid;s.textContent=e.claim;const b=document.createElement('button');b.className='eu-btn';b.type='button';b.textContent='['+e.n+']';b.setAttribute('aria-label','Afficher la preuve ['+e.n+']');b.setAttribute('aria-expanded','false');b.setAttribute('aria-controls','eu-b-'+e.n);const d=document.createElement('div');d.id='eu-b-'+e.n;d.className='lp-evidence-bubble-scroll';d.hidden=true;d.tabIndex=-1;d.innerHTML='<strong>'+e.title+'</strong><p><b>EU</b> '+e.id+'</p><p><b>Objet</b> '+e.metric+'</p><p><b>Contexte</b> '+e.ctx+'</p><p><b>Période</b> '+e.period+'</p><p><b>Validation</b> '+e.score+' · placement 98/100</p><p><b>Boundary</b> '+e.boundary+'</p><a href="#devicev-evidence-register-'+e.n+'">Registre interne</a> · <a href="'+e.url+'" target="_blank" rel="noopener">Source primaire</a>';p.append(s,b,d);let pin=false;const show=()=>{d.hidden=false;b.setAttribute('aria-expanded','true')},hide=(f=false)=>{pin=false;d.hidden=true;b.setAttribute('aria-expanded','false');if(f)b.focus()},maybe=()=>setTimeout(()=>{if(!pin&&!p.matches(':hover')&&!p.contains(document.activeElement))hide()},80);b.onmouseenter=show;b.onfocus=show;b.onmouseleave=maybe;b.onclick=x=>{x.preventDefault();pin=!pin;if(pin){show();d.focus()}else hide()};d.onmouseleave=maybe;d.onfocusout=maybe;[b,d].forEach(x=>x.onkeydown=k=>{if(k.key==='Escape'){k.preventDefault();hide(true)}});return p}function flow(a){const d=document.createElement('div');d.className='flow';d.setAttribute('aria-label','Decision-to-Feature Trace');d.innerHTML='<div>Décision pharma</div><div>Risque + contexte d’usage</div><div>Critères d’acceptation</div><div>Contrôle + revue humaine</div><div>Preuve + owner</div>';after(a,d)}function proofs(s){if(!s||s.querySelector('.pf'))return;const d=document.createElement('div');d.className='pf';const P=[['Lottery dApp · 2023','Solidity · EVM · TypeScript · 26/29 commits','https://github.com/RickOwri/Encode-Club-Solidity-Bootcamp-Project-W5-LotteryDapp bliographie des preuves externes');a.innerHTML='<h2>Références de preuve</h2><ol>'+E.map(e=>'<li id="devicev-evidence-register-'+e.n+'"><strong>'+e.title+'.</strong> '+e.period+'. <a href="'+e.url+'" target="_blank" rel="noopener">Source primaire</a>. '+e.boundary+'</li>').join('')+'</ol>';const f=document.querySelector('footer');f?f.parentNode.insertBefore(a,f):document.body.appendChild(a)}function patch(){document.documentElement.lang='fr';document.documentElement.dataset.theme='dark';rep(document,'Une feature qui influence une décision pharma doit tracer risque, exigence, contrôle, preuve.','Transformer une contrainte pharma en feature spécifiée, testable et défendable — avant le développement.');rep(document,'Transformer les décisions du client pharma en fonctionnalités dont les preuves, permissions, validations et responsabilités sont conçues avec le produit.','Relier décision métier, risque, exigence, critères d’acceptation, contrôles et preuve dans le même objet produit — pour que Produit, Qualité, Data et IA partagent la même définition de terminé.');rep(document,'Un backlog priorisé par le métier, des spécifications conformes dès la conception et un delivery vérifiable, sprint après sprint.','Un backlog arbitré par risque et usage, des critères d’acceptation visibles avant estimation et un owner de preuve défini avant la release.');const p=sec('La logique, avant les outils');if(p){rep(p,'Transformer les décisions du client pharma en fonctionnalités dont les preuves, permissions, validations et responsabilités sont conçues avec le produit.','Relier chaque décision pharma à une exigence, une feature, un contrôle et une preuve — dans le backlog, pas dans un dossier parallèle.');const a=[...p.querySelectorAll('p')].find(x=>N(x.textContent).startsWith('Un backlog nourri au feedback'))||p.querySelector('h2'),c=bubble(E[0]);after(a,c);flow(c)}const r=sec('Ce qui est visé, et de quel type.');if(r){const a=[...r.querySelectorAll('p')].find(x=>N(x.textContent).startsWith('Chaque ligne indique son statut'))||r.querySelector('h2');after(a,bubble(E[1]))}const s=sec('Des preuves proportionnées à la promesse.');if(s){rep(s,'R&D PharmD, mappings OHDSI/OMOP et intégrations Therapeutics Data Commons alignées sur les cas métier.','Le socle démontré combine 7+ ans d’opérations pharmaceutiques et réglementées, de l’ingénierie logicielle depuis 2021 et un portefeuille public vérifié ; les résultats HealthTech client restent sous NDA.');rep(s,'R&D PharmD — OHDSI/OMOP & Therapeutics Data Commons','Terrain pharma + ingénierie produit vérifiable');const q=[...s.querySelectorAll('p')].find(x=>N(x.textContent).startsWith('Mappings et intégrations alignés sur des cas métier réels'));if(q)q.textContent='Preuve santé : pharmacie d’officine 2015–2023, radiopharmacie 2018–2019, cursus pharmacie 2014–2020. Preuve engineering : projets publics vérifiés 2023–2024. Les résultats de production HealthTech restent distincts et non publiés tant qu’ils sont sous NDA.';proofs(s)}market();const f=sec('Ce qui reste à lever.');if(f){rep(f,'Il ajoute du temps au raffinement et en retire à la reprise et à l’audit. La phase 3 mesure les deux sur deux ou trois fonctionnalités réelles avant de généraliser.','La phase 3 mesure séparément le temps ajouté au raffinement et le temps de reprise ou d’audit sur deux ou trois fonctionnalités réelles avant toute généralisation.');rep(f,'En les ramenant au risque produit sous-jacent, où elles convergent presque toujours. Ce qui reste réellement divergent devient une option documentée, pas une branche de code.','En les ramenant au risque produit sous-jacent : ce qui converge devient une exigence commune ; ce qui reste divergent devient une option documentée, pas une branche de code.')}const g=sec('Ce qui est garanti est le produit de travail');if(g)rep(g,'La vélocité de l’équipe n’est pas garantie ; le format ajoute du travail au raffinement et en retire à l’audit.','La vélocité de l’équipe n’est pas garantie ; l’effet du format
