function intervalEug(id,title,question,data,min,max,boundary){const f=eugShell(id,title,question,boundary),w=760,left=180,right=24,row=42,top=35,h=top+data.length*row+22,inner=w-left-right;const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('role','img');svg.setAttribute('aria-label',question);const x=v=>left+(v-min)/(max-min)*inner;let html='';for(let y=Math.ceil(min);y<=Math.floor(max);y+=2){html+=`<line class="axis" x1="${x(y)}" y1="20" x2="${x(y)}" y2="${h-25}" opacity=".25"/><text class="tick" x="${x(y)}" y="14" text-anchor="middle">${y}</text>`}data.forEach((d,i)=>{const yy=top+i*row;html+=`<text class="label" x="0" y="${yy+4}">${d[0]}</text><line class="${i%2?'line2':'line'}" x1="${x(d[1])}" y1="${yy}" x2="${x(d[2])}" y2="${yy}"/><circle class="mark" cx="${x(d[1])}" cy="${yy}" r="4"/><circle class="mark2" cx="${x(d[2])}" cy="${yy}" r="4"/>`});svg.innerHTML=html;f.insertBefore(svg,f.lastChild);return f}
function pointEug(id,title,question,data,min,max,boundary){const f=eugShell(id,title,question,boundary),w=760,left=185,right=24,row=39,top=35,h=top+data.length*row+22,inner=w-left-right;const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('role','img');svg.setAttribute('aria-label',question);const x=v=>left+(v-min)/(max-min)*inner;let html='';for(let y=Math.ceil(min);y<=Math.floor(max);y+=3){html+=`<line class="axis" x1="${x(y)}" y1="20" x2="${x(y)}" y2="${h-25}" opacity=".25"/><text class="tick" x="${x(y)}" y="14" text-anchor="middle">${y}</text>`}data.forEach((d,i)=>{const yy=top+i*row;html+=`<text class="label" x="0" y="${yy+4}">${d[0]}</text><circle class="${i%2?'mark2':'mark'}" cx="${x(d[1])}" cy="${yy}" r="6"/><text class="tick" x="${x(d[1])+9}" y="${yy+4}">${d[1].toFixed(2).replace('.00','')}</text>`});svg.innerHTML=html;f.insertBefore(svg,f.lastChild);return f}
function funnelEug(){const f=eugShell('QGEU-HT-EVIDENCE-RESEARCH-FUNNEL-2026','Evidence research funnel','How much evidence was screened, gated, shortlisted and finally placed on this page?','Counts describe this review process, not market size, evidence quality by themselves, or a probability of truth. The 80 candidates are 65 current NeoFort domain candidates plus 15 recent open-web candidates. New graphic placements remain review-only until the canonical graphic-presentation judge runs.');const d=document.createElement('div');d.className='ht-funnel';[['80','screened candidates'],['65','NeoFort domain candidates'],['61','proof-carrying / Factfulness-allowed'],['30','semantic shortlist'],['12','EU page placements']].forEach(x=>{const c=document.createElement('div');c.innerHTML='<strong>'+x[0]+'</strong><small>'+x[1]+'</small>';d.appendChild(c)});f.insertBefore(d,f.lastChild);return f}

function bibliography(){const a=document.createElement('aside');a.id='devicev-bibliography';a.className='ht-bib';a.setAttribute('aria-label','Evidence register');a.innerHTML='<h2>Evidence register · DEVICEV review</h2><p>This register exposes the evidence used in Level 1 copy. Each inline marker resolves to one EvidenceUnit. New graphic placements are intentionally review-only until <code>judge:evidence-graphic:presentation-v1</code> is executed under the current NeoFort policy set.</p><ol>'+E.map(e=>'<li id="devicev-evidence-register-'+e.n+'"><strong>['+e.n+'] '+e.id+'</strong> — '+e.title+'. '+e.period+'. <a href="'+e.url+'" target="_blank" rel="noopener">Source</a>. <em>'+e.boundary+'</em></li>').join('')+'</ol><details><summary>Research loop · 80 screened → 30 shortlisted</summary><p><strong>NeoFort:</strong> 65 current domain candidates were retrieved; 61 were already deterministic-preflight / Factfulness-allowed under the query used for this page. <strong>Open web:</strong> 15 recent FDA, EMA, European Commission and arXiv candidate sources were separately screened. <strong>Shortlist:</strong> 30 EvidenceUnit IDs were retained for semantic fit; only 12 are inserted as inline page evidence.</p><p><strong>30-EU shortlist:</strong> '+RESEARCH.selected.join(' · ')+'</p><p><strong>15 open-web candidate locators:</strong> '+WEB_CANDIDATES.map(u=>'<a href="'+u+'" target="_blank" rel="noopener">source</a>').join(' · ')+'</p></details><p><strong>Base snapshot:</strong> <code>'+BASE_SHA+'</code>. <strong>Publication posture:</strong> FAIL_CLOSED / review artifact. A GitHub commit proves persistence only, not evidentiary validity.</p>';const f=document.querySelector('footer');f?f.parentNode.insertBefore(a,f):document.body.appendChild(a)}

 rep('Ce que le mandat déplace.','The operating state this engagement is designed to move.');
 rep('Ce qui est visé, et de quel type.','What is targeted — and what kind of claim each target is.');
 rep('Chaque ligne indique son statut : critère de recette, estimation modélisée, ou exemple déjà construit.','Each line keeps its epistemic status explicit: acceptance criterion, deterministic derivation, public capability proof or external evidence.');
