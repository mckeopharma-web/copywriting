<!doctype html>
<html lang="fr" data-theme="dark" data-devicev-version="1.0.0" data-merge-version="healthtech-product-unified-v2" data-publication-status="REVIEW_ONLY_BLOCKED_EUG_JUDGES">
<head>

<title>HealthTech & PharmaTech Product Engineering · Unified evidence review</title>
<style>
:root{color-scheme:dark;--bg:#060820;--panel:#0b1030;--line:#29304d;--paper:#f1f5ff;--muted:#aab3cc;--cyan:#19d3e2;--violet:#9a8cff;--warn:#f0c674}

.boot{min-height:100vh;display:grid;place-items:center;padding:32px}.boot>div{max-width:820px;padding:26px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.boot p{color:var(--muted);line-height:1.62}.boot small{color:var(--cyan)}

<body>
<main id="boot" class="boot"><div><small>REVIEW_ONLY · DEVICEV · UNIFIED V2</small><h1>HealthTech &amp; PharmaTech Product Engineering</h1><p>Chargement du snapshot GitHub immuable, puis fusion des couches copywriting, Customer Avatar et EUGP. Les graphiques restent dans leur section hôte et passent en preuve latérale sur écran large.</p></div></main>
<script>
(()=>{'use strict';
const REPO='mckeopharma-web/copywriting';
const SOURCE_COMMIT='6775c009d68fa36bb156babc6c88c1836fb988ac';
const SOURCE_BLOB_SHA='2768e33288f04674275d672c4309cccd19f7de78';
const SOURCE_PATH='expertises/healthtech-product/healthtech-product.html';
const LOSSLESS_PATH='expertises/healthtech-product/healthtech-product_lossless-evidence-v1.2_2026-09-02.html';
const LOSSLESS_BLOB_SHA='29882824c04cbede86d9d13c9e178a3de1b87488';
const RAW='https://raw.githubusercontent.com/'+REPO+'/'+SOURCE_COMMIT+'/'+SOURCE_PATH;
const MUTABLE_LOSSLESS='https://raw.githubusercontent.com/'+REPO+'/main/'+LOSSLESS_PATH;
const PINNED_LOSSLESS='https://raw.githubusercontent.com/'+REPO+'/'+SOURCE_COMMIT+'/'+LOSSLESS_PATH;

const SIDE_CSS=`
/* Unified v2: every Evidence Graph Unit must remain inside an existing host section. */
.ht-eug{
 float:inline-end!important;width:min(43%,520px)!important;max-width:520px!important;min-width:320px;
 clear:inline-end;margin:.35rem 0 1.5rem clamp(1.1rem,3vw,2.4rem)!important;box-sizing:border-box
}
.ht-eug svg{max-height:420px}
.ht-eug[data-eugp-host-section]{box-shadow:0 18px 48px #0003}
.ht-eug[data-eugp-route="DATA_ANALYSIS_LAB_REBUILD_REPLACEMENT"]::before,
.ht-eug[data-eugp-route="RERUN_CURRENT_JUDGES"]::before{
 content:"REVIEW ONLY · evidence graph not publication-ready";display:block;margin:0 0 .65rem;
 color:#f0c674;font-size:.62rem;font-weight:800;letter-spacing:.055em;text-transform:uppercase
}
.ht-eug-host-clear{display:block;clear:both;width:100%;height:0;overflow:hidden}
@supports not (float:inline-end){.ht-eug{float:right!important;clear:right}}
@media(max-width:980px){.ht-eug{float:none!important;clear:both!important;width:100%!important;max-width:none!important;min-width:0;margin:1rem 0 1.35rem!important}.ht-eug svg{max-height:none}}
`;

const COPY_PATCH=[
['Une feature qui influence une décision pharma doit tracer risque, exigence, contrôle, preuve.','Transformez une exigence pharma en feature spécifiable, testable et défendable — avant que le développement ne commence.'],
['Transformer les décisions du client pharma en fonctionnalités dont les preuves, permissions, validations et responsabilités sont conçues avec le produit.','J’aide les Product Managers d’éditeurs HealthTech vendant à la pharma à convertir exigences client, risques et contraintes de preuve en backlog exploitable — avec critères d’acceptation, responsabilités et validation humaine intégrés à la feature.'],
['User stories reliées au risque pharmaceutique, critères d’acceptation, documentation par fonctionnalité, contrôles IA/data, revue humaine et delivery vérifiable.','Un backlog où chaque feature relie le besoin client, le risque à défendre, les critères d’acceptation, la responsabilité et la preuve attendue.'],
['Vous reconnaissez l’un de ces moments, ou ce n’est pas encore le sujet.','Si l’un de ces quatre moments vous est arrivé, le problème n’est probablement plus « la documentation ».'],
['Ce que ça coûte, et pourquoi le contournement évident ne tient pas.','Trois endroits où la dette de preuve se crée — et comment la déplacer en amont.'],
['Le décideur qui achète ce mandat, et ce qui pèse sur lui.','Pour le Product Manager qui doit traduire une contrainte pharma sans ralentir toute l’équipe.'],
['Quatre attributs, quatre questions d’achat.','Ce que l’intervention doit rendre plus simple à décider.'],
['Quelle configuration, et combien.','Un rôle intégré quand le backlog doit rester aligné plusieurs mois.'],
['Ce qui existe à la fin et n’existait pas avant.','Trois actifs concrets que votre équipe conserve à la passation.'],
['Ce que le mandat déplace.','Du backlog « à construire » au backlog « à défendre ».'],
['Les mêmes axes, avant et après.','Avant / après : les mêmes décisions, mais plus au même moment.'],
['Ce qui est visé, et de quel type.','Trois résultats de l’intervention — traités comme critères de recette, pas comme promesses de ROI.'],
['Des preuves proportionnées à la promesse.','Pourquoi me confier l’interface Produit × Pharma — et ce que ces preuves ne prétendent pas démontrer.'],
['Le périmètre, ses exclusions et ses dépendances.','Ce que vous achetez — et ce que vous n’achetez pas.'],
['Quatre phases, quatre sorties possibles.','Quatre phases ; chacune produit un actif utilisable et une décision de continuer ou d’arrêter.'],
['Les blocs de travail, sans ordre imposé.','Huit briques opérationnelles, conservées dans les blocs existants.'],
['Le différenciateur est le croisement, pas l’addition.','La valeur vient de l’interface supprimée entre Produit, Pharma et Assurance.'],
['Ce qui est garanti est le produit de travail, jamais le résultat d’une autorité.','Garantie : des livrables conformes aux critères de recette convenus — jamais une décision que votre client, Quality ou une autorité doit prendre.'],
['Évaluer la mission en 20 minutes','Décider en 20 minutes si ce mandat mérite d’aller plus loin'],
['Le bon format d’intervention, avant le premier rendez-vous.','Obtenir le format adapté avant le premier rendez-vous.']
];

const GRAPH_ROUTE={
 'QGEU-HT-EVIDENCE-RESEARCH-FUNNEL-2026':{route:'DATA_ANALYSIS_LAB_REBUILD_REPLACEMENT',reason:'MISSING_PROVENANCE_MANIFEST'},
 'QGEU-REGCSV-OFFICIAL-GUIDANCE-TIMELINE-2026':{route:'DATA_ANALYSIS_LAB_REBUILD_REPLACEMENT',reason:'PENDING_PRESENTATION_JUDGE_AND_SOURCE_MATERIALIZATION'},
 'QGEU-REGCSV-PROFESSIONAL-EVIDENCE-TIMELINE-2026':{route:'DATA_ANALYSIS_LAB_REBUILD_REPLACEMENT',reason:'PENDING_PRESENTATION_JUDGE_AND_SOURCE_CLOSURE'},
 'QGEU-REGCSV-PUBLIC-ENGINEERING-PROJECTS-TIMELINE-2026':{route:'DATA_ANALYSIS_LAB_REBUILD_REPLACEMENT',reason:'PENDING_PRESENTATION_JUDGE_AND_SOURCE_MATERIALIZATION'}
};

const MANIFEST={
 artifact_id:'healthtech-product-unified-v2-2026-09-04',
 scope:'ONLY https://mickael-umt.com/expertises/healthtech-product/',
 source_of_truth:'https://mickael-umt.com/expertises/healthtech-product/',
 source:{repository:REPO,commit:SOURCE_COMMIT,path:SOURCE_PATH,blob_sha:SOURCE_BLOB_SHA,lossless_path:LOSSLESS_PATH,lossless_blob_sha:LOSSLESS_BLOB_SHA},
 merge:{lossless_base:true,evidence_layer:true,commercial_copy:true,customer_avatar_v1_6:true,eugp_side_placement:true,data_analysis_routing:true,other_page_mutation:false,section_reorder:false,standalone_eug_section_forbidden:true},
 avatar:{id:'customer-avatar-profile:healthtech-product:isabelle-fontaine:v1.6',name:'Isabelle Fontaine',role:'Product Manager éditeur HealthTech',status:'INDUCTIVE_TO_VALIDATE',budget:'TO_RESEARCH',quote:'SYNTHESIS_NOT_VERBATIM',psychology:'TO_RESEARCH'},
 policies:{
  coverage:'policy:evidence-coverage-v4',
  graph_display:'policy:qgeu:data-visualization-analyst-v3',
  graphic_judge:'judge:evidence-graphic:presentation-v3',
  ordering:'policy:qgeu:ordering-contract-v1',
  eug_placement:'policy:eug-placement:statistical-display-ordering-contract-v2',
  source_materialization:'policy:qgeu:origin-document-materialization-v2',
  factfulness:'judge:evidence:factfulness-epistemology-methodology-v2',
  placement:'policy:evidence-placement:claim-span-entailment-v2@2.2',
  placement_judge:'judge:evidence-placement:presentation-v1.2',
  agent_exploitability:'policy:evidence-agent-exploitability:proof-carrying-v3',
  determinism:'policy:llm-judge:deterministic-execution-v2',
  verdict_normalization:'policy:evidence-judge-verdict-normalization:v2'
 },
 graph_decision_tree:[
  'NO_EXISTING_HOST_SECTION => BLOCK_AND_HIDE',
  'NO_QUANTITATIVE_OR_PROBABILITY_DATA => NOT_AN_EUG',
  'FAILED_OR_MISSING_SOURCE_CLOSURE_OR_PROVENANCE => DATA_ANALYSIS_LAB_REBUILD_REPLACEMENT',
  'SOURCE_CLOSURE_PASS_BUT_CURRENT_GRAPHIC_JUDGE_NOT_PASS => RERUN_CURRENT_JUDGES',
  'ALL_CURRENT_HARD_GATES_PASS => LAYOUT_ONLY_SIDE_PLACEMENT'
 ],
 source_verification:[
  {eu_id:'EU-HT-EMA-FDA-GOOD-AI-2026',authority:'EMA+FDA',status:'VERIFIED_CURRENT',url:'https://www.ema.europa.eu/en/about-us/how-we-work/data-regulation-big-data-other-sources/artificial-intelligence',boundary:'normative medicines-lifecycle AI principles; not outcome evidence'},
  {eu_id:'EU-CANON-EHDS-EHR-TESTING-2026',authority:'European Commission DG SANTE',status:'VERIFIED_CURRENT',url:'https://health.ec.europa.eu/ehealth-digital-health-and-care/ehds-action/ehds-platform_en',boundary:'EHDS-scope EHR testing/technical-documentation requirement; not performance evidence'}
 ],
 graph_routes:GRAPH_ROUTE,
 google_drive:{accessed_this_run:false,mutation_performed:false,write_requires_explicit_user_approval:true},
 publication:{allowed:false,reason:'Current target-page QGEU candidates do not yet satisfy current v3 graphic/source-closure/presentation gates. Layout is reviewable; evidence publication remains blocked.'}
};

function norm(s){return (s||'').replace(/\s+/g,' ').trim()}
function allText(root=document){return [...root.querySelectorAll('h1,h2,h3,h4,p,li,dt,dd,strong,span')]}
function exactOrContains(t,root=document){t=norm(t);return allText(root).find(x=>norm(x.textContent)===t)||allText(root).find(x=>norm(x.textContent).includes(t))}
function applyCopy(){
 let hits=0;
 COPY_PATCH.forEach(([a,b])=>{const el=exactOrContains(a);if(el&&el.dataset.dvCommercialPatched!=='1'){el.textContent=b;el.dataset.dvCommercialPatched='1';hits++}});
 document.documentElement.dataset.copyPatchHits=String(hits);
}
function qgeuId(fig){
 return fig.dataset.qgeuId||fig.getAttribute('data-qgeu-id')||fig.querySelector('[data-qgeu-id]')?.getAttribute('data-qgeu-id')||'';
}
function routeGraph(fig){
 const id=qgeuId(fig), known=GRAPH_ROUTE[id];
 if(!id)return {route:'RERUN_CURRENT_JUDGES',reason:'QGEU_ID_NOT_RESOLVED_IN_DOM'};
 if(known)return known;
 return {route:'RERUN_CURRENT_JUDGES',reason:'NO_CURRENT_PASS_CERTIFICATE_BOUND_TO_THIS_RENDER_SNAPSHOT'};
}
function bindGraphs(){
 const figs=[...document.querySelectorAll('.ht-eug')];
 if(!figs.length)return false;
 const hosts=new Set();let valid=0;
 figs.forEach((fig,i)=>{
  const host=fig.closest('section');
  if(!host){fig.dataset.eugpStatus='BLOCKED_NO_EXISTING_HOST_SECTION';fig.hidden=true;fig.setAttribute('aria-hidden','true');return;}
  hosts.add(host);
  const h2=host.querySelector('h2');
  if(h2&&!h2.id)h2.id='eugp-host-'+(i+1);
  const route=routeGraph(fig);
  fig.dataset.eugpPlacement='side';
  fig.dataset.eugpRoute=route.route;
  fig.dataset.eugpReason=route.reason;
  fig.dataset.eugpStatus='REVIEW_ONLY_NOT_PUBLICATION_READY';
  fig.dataset.eugpHostSection=host.dataset.sectionId||host.id||h2?.id||('section-'+(i+1));
  fig.setAttribute('role','complementary');
  if(h2)fig.setAttribute('aria-describedby',h2.id);
  valid++;
 });
 hosts.forEach(host=>{if(!host.querySelector(':scope > .ht-eug-host-clear')){const c=document.createElement('span');c.className='ht-eug-host-clear';c.setAttribute('aria-hidden','true');host.appendChild(c)}});
 document.documentElement.dataset.eugpBound=String(valid);
 document.documentElement.dataset.eugpTotal=String(figs.length);
 return valid===figs.length;
}
function tagAvatar(){
 const x=exactOrContains('Isabelle Fontaine');
 const s=x?.closest('section');
 if(s){s.dataset.customerAvatarId=MANIFEST.avatar.id;s.dataset.customerAvatarStatus=MANIFEST.avatar.status}
 document.documentElement.dataset.avatarContract='customer-avatar:healthtech-product:v1.6';
}
function installManifest(){
 document.getElementById('devicev-merged-contract')?.remove();
 const s=document.createElement('script');s.type='application/json';s.id='devicev-merged-contract';s.textContent=JSON.stringify(MANIFEST);document.body.appendChild(s);
}
function annotateStatus(){
 const s=document.getElementById('devicev-status');
 if(s&&!s.dataset.unifiedV2){s.dataset.unifiedV2='true';s.innerHTML+=' · unified v2 · EUGP side '+(document.documentElement.dataset.eugpBound||'0')+'/'+(document.documentElement.dataset.eugpTotal||'0')+' · graph v3 publication blocked'}
}
function apply(){
 if(document.querySelectorAll('section').length<1)return false;
 applyCopy();tagAvatar();bindGraphs();installManifest();annotateStatus();
 document.documentElement.dataset.mergeVersion='healthtech-product-unified-v2';
 document.documentElement.dataset.publicationStatus='REVIEW_ONLY_BLOCKED_EUG_JUDGES';
 return true;
}
const mo=new MutationObserver(()=>{if(apply()&&document.querySelectorAll('.ht-eug').length)mo.disconnect()});
mo.observe(document.documentElement,{subtree:true,childList:true});
setTimeout(()=>{apply();mo.disconnect()},9000);

async function boot(){
 try{
  const r=await fetch(RAW,{cache:'no-store'});if(!r.ok)throw new Error('source HTTP '+r.status);
  let src=await r.text();
  src=src.replace(MUTABLE_LOSSLESS,PINNED_LOSSLESS);
  src=src.replace('<html lang="en"','<html lang="fr"');
  const marker='</style>';if(!src.includes(marker))throw new Error('style marker missing');
  src=src.replace(marker,SIDE_CSS+'\n'+marker);
  const patch=`<script id="devicev-unified-runtime">${[
   norm.toString(),allText.toString(),exactOrContains.toString(),applyCopy.toString(),qgeuId.toString(),
   routeGraph.toString(),bindGraphs.toString(),tagAvatar.toString(),installManifest.toString(),annotateStatus.toString(),apply.toString()
  ].join('\n')}
const COPY_PATCH=${JSON.stringify(COPY_PATCH)};
const GRAPH_ROUTE=${JSON.stringify(GRAPH_ROUTE)};
const MANIFEST=${JSON.stringify(MANIFEST)};
const mo=new MutationObserver(()=>{if(apply()&&document.querySelectorAll('.ht-eug').length)mo.disconnect()});
mo.observe(document.documentElement,{subtree:true,childList:true});
setTimeout(()=>{apply();mo.disconnect()},9000);<\/script>`;
  src=src.replace('</body>',patch+'\n</body>');
  document.open();document.write(src);document.close();
 }catch(e){
  document.getElementById('boot').innerHTML='<div><h1>HealthTech &amp; PharmaTech Product Engineering</h1><p>Le snapshot immuable n’a pas pu être chargé. Aucun fallback inventé : artefact bloqué en revue.</p><code>'+String(e).replace(/[<>]/g,'')+'</code></div>';
 }
}
boot();
})();</script>
</body></html>
