name: Blockchain offer structure + commercial copy

on:
  push:
    branches:
      - main
    paths:
      - 'expertises/blockchain/blockchain.html'
      - 'expertises/blockchain/*.xml'
      - 'contracts/blockchain-offer-structure-lock.json'
      - 'scripts/upgrade_blockchain_commercial_copy.py'
      - 'scripts/validate_blockchain_offer_structure.py'
      - '.github/workflows/blockchain-offer-structure-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blockchain-offer-structure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate blockchain XML audit artifacts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          paths = sorted(Path("expertises/blockchain").glob("*.xml"))
          if not paths:
              raise SystemExit("No blockchain XML artifacts found.")
          for path in paths:
              ET.parse(path)
              print(f"XML PASS: {path}")
          PY

      - name: Materialize commercial copy without topology drift
        run: python3 scripts/upgrade_blockchain_commercial_copy.py

      - name: Validate exact 18-section offer structure
        run: python3 scripts/validate_blockchain_offer_structure.py

      - name: Commit deterministic repair
        shell: bash
        run: |
          if git diff --quiet -- expertises/blockchain/blockchain.html; then
            echo 'No repair required.'
            exit 0
          fi
          git config user.name 'blockchain-structure-bot'
          git config user.email 'blockchain-structure-bot@users.noreply.github.com'
          git add expertises/blockchain/blockchain.html
          git commit -m 'feat(blockchain): commercialize offer page under 18-section lock'
          git push
