name: AI Security exact graph-label repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-security.yml'

permissions:
  contents: write

concurrency:
  group: ai-security-evidence-closure
  cancel-in-progress: false

jobs:
  repair-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair only permission-policy graph category joins
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import json,re,subprocess

          path=Path('expertises/ai-security/ai-security.html')
          expected_blob='2155bb555cf9a00c4acae9de8e016cb184ae2695'
          actual=subprocess.check_output(['git','hash-object',str(path)],text=True).strip()
          if actual != expected_blob:
              raise SystemExit(f'FAIL_CLOSED: blob changed {actual} != {expected_blob}')
          s=path.read_text(encoding='utf-8')
          before=s
          expected_sections=['triggers','consequences','buyer','qualification','proposition','offers','deliverables','before-after','results','evidence','scope','process','modules','intersection','commitments','questions','engagement']
          if re.findall(r'<section id="([^"]+)"',s) != expected_sections:
              raise SystemExit('FAIL_CLOSED: section topology mismatch')

          pat=re.compile(r'(<script type="application/json" id="eug-data">)(.*?)(</script>)',re.S)
          m=pat.search(s)
          if not m:
              raise SystemExit('FAIL_CLOSED: eug-data missing')
          data=json.loads(m.group(2))
          q='QGEU-AISEC-PERMISSION-OVERREACH-2026'
          spec=data[q]
          canonical={
            'Insurance':'Add travel insurance',
            'Timesheet':'Delete old timesheet',
            'Bank data':'Read bank transactions',
            'Public post':'Post travel publicly',
            'Lounge pass':'Buy lounge pass',
            'Private msgs':'Read private messages'
          }
          for d in spec['data']:
              d['category']=canonical.get(d['category'],d['category'])
          expected_categories=['Confirm flight','Add travel insurance','Delete old timesheet','Read bank transactions','Post travel publicly','Buy lounge pass','Read private messages']
          expected_series=['HITL','AUTO','POLICY']
          pairs=Counter((d['category'],d['series']) for d in spec['data'])
          if len(spec['data']) != 21:
              raise SystemExit('FAIL_CLOSED: permission graph must contain 21 source marks')
          if list(dict.fromkeys(d['category'] for d in spec['data'])) != expected_categories:
              raise SystemExit('FAIL_CLOSED: category order mismatch')
          if spec['series'] != expected_series:
              raise SystemExit('FAIL_CLOSED: series order mismatch')
          for c in expected_categories:
              for ser in expected_series:
                  if pairs[(c,ser)] != 1:
                      raise SystemExit(f'FAIL_CLOSED: missing/duplicate pair {c} × {ser}')
          payload=json.dumps(data,ensure_ascii=False,separators=(',',':'))
          s=s[:m.start()]+m.group(1)+payload+m.group(3)+s[m.end():]
          if s == before:
              raise SystemExit('FAIL_CLOSED: no graph-label repair produced')
          ids=re.findall(r'\sid="([^"]+)"',s)
          dup=[k for k,v in Counter(ids).items() if v>1]
          if dup:
              raise SystemExit(f'FAIL_CLOSED: duplicate ids {dup}')
          path.write_text(s,encoding='utf-8')
          print('PASS: 7 categories × 3 conditions join exactly; 21 source marks preserved.')
          PY
      - name: Render and validate all graph marks
        shell: bash
        run: |
          python -m http.server 8765 --directory . >/tmp/ai-security-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          [ -n "$BROWSER" ] || { echo 'FAIL_CLOSED: no headless browser'; exit 1; }
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=3000 --dump-dom 'http://127.0.0.1:8765/expertises/ai-security/ai-security.html' > /tmp/ai-security-rendered.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/ai-security-rendered.html').read_text(encoding='utf-8')
          if s.count('class="eug-svg"') != 4:
              raise SystemExit('FAIL_CLOSED: expected 4 SVG graphs')
          cards=re.findall(r'<article class="eug-card"[\s\S]*?</article>',s)
          if len(cards)!=4:
              raise SystemExit('FAIL_CLOSED: expected 4 rendered graph cards')
          # One rect per source mark in each chart: 16 + 8 + 10 + 21 = 55.
          rects=sum(c.count('<rect') for c in cards)
          if rects != 55:
              raise SystemExit(f'FAIL_CLOSED: expected 55 rendered data marks, got {rects}')
          if 'data-theme="dark"' not in s or s.count('lp-evidence-bubble-scroll') < 14:
              raise SystemExit('FAIL_CLOSED: night mode/evidence UI missing')
          print('PASS: rendered 4 charts / 55 data-bound marks / evidence UI.')
          PY
      - name: Commit validated page only
        shell: bash
        run: |
          git config user.name 'ai-security-evidence-bot'
          git config user.email 'ai-security-evidence-bot@users.noreply.github.com'
          git add -- expertises/ai-security/ai-security.html
          git commit -m 'fix(ai-security): preserve exact graph category joins'
          git push
