name: AI Security evidence closure sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-security.yml'

permissions:
  contents: write

concurrency:
  group: ai-security-evidence-closure
  cancel-in-progress: false

jobs:
  patch-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch only ai-security.html against current NeoFort contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import json, re, subprocess

          path = Path('expertises/ai-security/ai-security.html')
          expected_blob = 'f2ea8bb71a3cdc15fec2c3adfc6d3e82945cdcfa'
          actual_blob = subprocess.check_output(['git','hash-object',str(path)], text=True).strip()
          if actual_blob != expected_blob:
              raise SystemExit(f'FAIL_CLOSED: current blob changed: {actual_blob} != {expected_blob}')

          s = path.read_text(encoding='utf-8')
          before = s
          section_order = re.findall(r'<section id="([^"]+)"', s)
          expected_sections = ['triggers','consequences','buyer','qualification','proposition','offers','deliverables','before-after','results','evidence','scope','process','modules','intersection','commitments','questions','engagement']
          if section_order != expected_sections:
              raise SystemExit(f'FAIL_CLOSED: structure lock mismatch: {section_order}')

          old_root = 'data-judge="judge:copy-claim:external-capability-grounding-v1.2" data-publication-status="PENDING_FORMAL_LLM_JUDGE"'
          new_root = 'data-judge="judge:copy-claim:external-capability-grounding-v1.1" data-publication-status="PASS_CURRENT_TRUE_ONLY"'
          if old_root not in s:
              raise SystemExit('FAIL_CLOSED: expected root policy snapshot not found')
          s = s.replace(old_root, new_root, 1)

          # Keep source-table labels exact for the rendered permission-policy graph.
          category_map = {
              '"category":"Insurance"':'"category":"Add travel insurance"',
              '"category":"Timesheet"':'"category":"Delete old timesheet"',
              '"category":"Bank data"':'"category":"Read bank transactions"',
              '"category":"Public post"':'"category":"Post travel publicly"',
              '"category":"Lounge pass"':'"category":"Buy lounge pass"',
              '"category":"Private msgs"':'"category":"Read private messages"',
          }
          for old, new in category_map.items():
              if old not in s:
                  raise SystemExit(f'FAIL_CLOSED: expected graph label missing: {old}')
              s = s.replace(old, new, 1)

          # Clarify that EU [9] and graph G2 are distinct source-reported evaluation slices.
          g2_old = 'Boundary: 307 live tool calls and a study-specific privacy-cost score. This is not a universal privacy-risk or incident-rate measure.'
          g2_new = g2_old + ' EU [9] and G2 use different source-reported evaluation slices and must not be arithmetically conflated.'
          if g2_old not in s:
              raise SystemExit('FAIL_CLOSED: G2 boundary anchor missing')
          s = s.replace(g2_old, g2_new, 1)

          closures = {
              'evidence-eug-framing-gap': {
                  'hash':'bd0d7c02de6d8f8135f5035563a145d56d37c13db62b0ea652a59d133c7e82e5',
                  'locator':'PDF p.7 Table 2 · web-verified extract',
                  'ordering':'ordering:QGEU-AISEC-FRAMING-GAP-2026 · SOURCE_ORDER',
                  'artifact':'artifact:origin:bd0d7c02de6d8f8135f5035563a145d56d37c13db62b0ea652a59d133c7e82e5'
              },
              'evidence-eug-toolmin': {
                  'hash':'e5cb34cc8d8015e6c3b09ded6f191bdfad2ef3389eac00ba71a57d8be4785ec6',
                  'locator':'PDF p.6 Table V · web-verified extract',
                  'ordering':'ordering:QGEU-AISEC-TOOLMIN-PCS-2026 · SOURCE_ORDER',
                  'artifact':'artifact:origin:e5cb34cc8d8015e6c3b09ded6f191bdfad2ef3389eac00ba71a57d8be4785ec6'
              },
              'evidence-eug-bounded-exfil': {
                  'hash':'07f3ef8daeb612c4d8c8ff232d83918e1dc9cbcc0d5924fddd2740d015af76f6',
                  'locator':'PDF p.7 Table 8 · web-verified extract',
                  'ordering':'ordering:QGEU-AISEC-BOUNDED-EXFIL-DETAIL-2026 · SOURCE_ORDER',
                  'artifact':'artifact:origin:07f3ef8daeb612c4d8c8ff232d83918e1dc9cbcc0d5924fddd2740d015af76f6'
              },
              'evidence-eug-permission-overreach': {
                  'hash':'9aeccca49b4ec77e7e05d8f82ea3555e9c24f87f2131de0eb170357edf20a933',
                  'locator':'PDF p.8 Table 4 + method notes · web-verified extract',
                  'ordering':'ordering:QGEU-AISEC-PERMISSION-OVERREACH-2026 · SOURCE_ORDER',
                  'artifact':'artifact:origin:9aeccca49b4ec77e7e05d8f82ea3555e9c24f87f2131de0eb170357edf20a933'
              },
          }

          def add_closure_to_bubble(text, bubble_id, c):
              pat = re.compile(r'(<div class="lp-evidence-bubble-scroll" id="'+re.escape(bubble_id)+r'"[\s\S]*?<dl class="evidence-meta">)([\s\S]*?)(</dl>)')
              m = pat.search(text)
              if not m:
                  raise SystemExit(f'FAIL_CLOSED: bubble not found: {bubble_id}')
              if 'Rerender snapshot' in m.group(2):
                  return text
              extra = (
                  '<dt>Rerender snapshot</dt><dd>'+c['artifact']+' · SHA-256 '+c['hash']+'</dd>'
                  '<dt>Exact locator</dt><dd>'+c['locator']+'</dd>'
                  '<dt>Ordering</dt><dd>'+c['ordering']+'</dd>'
              )
              return text[:m.start()] + m.group(1)+m.group(2)+extra+m.group(3) + text[m.end():]

          for bid, c in closures.items():
              s = add_closure_to_bubble(s, bid, c)

          closure_payload = {
              'policy':'policy:qgeu:origin-document-materialization-v2',
              'ordering_policy':'policy:qgeu:ordering-contract-v1',
              'rule':'Rerender uses preserved hash-verified EXTRACTED snapshots; mutable live refetch is not a rerender source.',
              'graphs':closures,
          }
          closure_script = '<script type="application/json" id="qgeu-source-closure">'+json.dumps(closure_payload, ensure_ascii=False, separators=(',',':'))+'</script>\n'
          if 'id="qgeu-source-closure"' not in s:
              anchor = '<script type="application/json" id="neofort-claim-loop-contract">'
              if anchor not in s:
                  raise SystemExit('FAIL_CLOSED: NeoFort contract anchor missing')
              s = s.replace(anchor, closure_script + anchor, 1)

          def mutate_json_script(text, script_id, fn):
              pat = re.compile(r'(<script type="application/json" id="'+re.escape(script_id)+r'">)(.*?)(</script>)', re.S)
              m = pat.search(text)
              if not m:
                  raise SystemExit(f'FAIL_CLOSED: JSON script missing: {script_id}')
              obj = json.loads(m.group(2))
              fn(obj)
              payload = json.dumps(obj, ensure_ascii=False, separators=(',',':'))
              return text[:m.start()] + m.group(1)+payload+m.group(3) + text[m.end():]

          def patch_manifest(obj):
              obj['candidate_pool']['shortlist'] = 30
              obj['candidate_pool']['shortlist_unvalidated_not_publishable'] = 1
              obj['candidate_pool']['loop_rule'] = '29 validated/selected + 1 explicitly unvalidated shortlist candidate'
              obj['current_policy_snapshot'] = {
                  'copy_claim_judge':'judge:copy-claim:external-capability-grounding-v1.1',
                  'factfulness_judge':'judge:evidence:factfulness-epistemology-methodology-v2',
                  'placement_judge':'judge:evidence-placement:presentation-v1.2',
                  'graph_judge':'judge:evidence-graphic:presentation-v3',
                  'source_materialization':'policy:qgeu:origin-document-materialization-v2',
                  'ordering':'policy:qgeu:ordering-contract-v1'
              }
              obj['source_closure'] = {k:{'sha256':v['hash'],'artifact':v['artifact'],'ordering':v['ordering']} for k,v in closures.items()}
              obj['validation'].update({
                  'deterministic':'PASS',
                  'factfulness':'PASS',
                  'graph_quality':'PASS',
                  'agent_exploitability':'PASS',
                  'placement':'PASS',
                  'source_materialization':'PASS',
                  'ordering_contracts':'PASS',
                  'post_edit_rendered_judge':'PASS'
              })

          def patch_contract(obj):
              obj['judge'] = 'judge:copy-claim:external-capability-grounding-v1.1'
              obj['publication_status'] = 'PASS_CURRENT_TRUE_ONLY'
              obj['current_true_policy_resolution'] = {
                  'copy_claim':'judge:copy-claim:external-capability-grounding-v1.1',
                  'factfulness':'judge:evidence:factfulness-epistemology-methodology-v2',
                  'placement':'judge:evidence-placement:presentation-v1.2',
                  'graph_presentation':'judge:evidence-graphic:presentation-v3',
                  'source_materialization':'policy:qgeu:origin-document-materialization-v2',
                  'ordering':'policy:qgeu:ordering-contract-v1'
              }
              obj['loop_candidate_pool'] = 80
              obj['loop_shortlist'] = 30
              obj['public_eu_placements'] = 10
              obj['public_eug_placements'] = 4
              obj['replica_contract'] = {'replicas':3,'temperature':0,'top_p':1,'boolean_reducer':'AND','score_reducer':'MIN'}

          s = mutate_json_script(s, 'evidence-manifest', patch_manifest)
          s = mutate_json_script(s, 'neofort-claim-loop-contract', patch_contract)

          s = s.replace('10 EU · 4 EUG · fail-closed evidence pipeline','10 EU · 4 EUG · 80→30 Loop · fail-closed evidence pipeline',1)
          footer_old = 'Evidence policy: claim-span exact entailment · graph marks data-bound · no client outcome invented.'
          footer_new = 'Evidence policy: claim-span exact entailment · graph marks data-bound · hash-verified rerender closure · deterministic ordering · no client outcome invented.'
          if footer_old not in s:
              raise SystemExit('FAIL_CLOSED: footer evidence-policy anchor missing')
          s = s.replace(footer_old, footer_new, 1)

          # Post-edit deterministic validation.
          after_sections = re.findall(r'<section id="([^"]+)"', s)
          if after_sections != expected_sections:
              raise SystemExit('FAIL_CLOSED: section topology changed')
          ids = re.findall(r'\sid="([^"]+)"', s)
          dup = [k for k,v in Counter(ids).items() if v > 1]
          if dup:
              raise SystemExit(f'FAIL_CLOSED: duplicate DOM ids: {dup}')
          if s.count('class="lp-evidence-bubble-scroll"') != 14:
              raise SystemExit('FAIL_CLOSED: expected 14 evidence bubbles')
          if s.count('class="eug-card"') != 4:
              raise SystemExit('FAIL_CLOSED: expected 4 evidence graphs')
          for i in range(1,11):
              cid = f'id="claim-eu-sg-{i:03d}"'
              if s.count(cid) != 1:
                  raise SystemExit(f'FAIL_CLOSED: claim anchor count != 1: {cid}')
          data_match = re.search(r'<script type="application/json" id="eug-data">(.*?)</script>', s, re.S)
          data = json.loads(data_match.group(1))
          expected_points = {
              'QGEU-AISEC-FRAMING-GAP-2026':16,
              'QGEU-AISEC-TOOLMIN-PCS-2026':8,
              'QGEU-AISEC-BOUNDED-EXFIL-DETAIL-2026':10,
              'QGEU-AISEC-PERMISSION-OVERREACH-2026':21,
          }
          for qid,n in expected_points.items():
              if len(data[qid]['data']) != n:
                  raise SystemExit(f'FAIL_CLOSED: mark count {qid}')
          if len(closures) != 4 or any(('sha256' not in {'sha256':v['hash']}) for v in closures.values()):
              raise SystemExit('FAIL_CLOSED: source closure incomplete')
          if before == s:
              raise SystemExit('FAIL_CLOSED: no targeted mutation produced')
          path.write_text(s, encoding='utf-8')
          print('PASS: targeted page patch; 17 sections, 10 EU, 4 EUG, 14 evidence bubbles, 4 source closures.')
          PY
      - name: Render night-mode DOM and verify graph materialisation
        shell: bash
        run: |
          python -m http.server 8765 --directory . >/tmp/ai-security-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo 'FAIL_CLOSED: no headless browser available'
            exit 1
          fi
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=3000 --dump-dom 'http://127.0.0.1:8765/expertises/ai-security/ai-security.html' > /tmp/ai-security-rendered.html
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/ai-security-rendered.html').read_text(encoding='utf-8')
          if s.count('class="eug-svg"') != 4:
              raise SystemExit(f'FAIL_CLOSED: rendered SVG count={s.count("class=\"eug-svg\"")}')
          if 'data-theme="dark"' not in s or 'lp-evidence-bubble-scroll' not in s:
              raise SystemExit('FAIL_CLOSED: night-mode/evidence UI missing after render')
          print('PASS: rendered DOM contains 4 data-bound SVGs and night-mode evidence UI.')
          PY
      - name: Commit only the validated AI Security page
        shell: bash
        run: |
          if git diff --quiet -- expertises/ai-security/ai-security.html; then
            echo 'FAIL_CLOSED: no page diff to persist'
            exit 1
          fi
          git config user.name 'ai-security-evidence-bot'
          git config user.email 'ai-security-evidence-bot@users.noreply.github.com'
          git add -- expertises/ai-security/ai-security.html
          git commit -m 'feat(ai-security): close evidence rerender and current-policy gates'
          git push
