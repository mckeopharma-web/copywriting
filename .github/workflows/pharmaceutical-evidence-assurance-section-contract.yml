name: PEA section contract audit

on:
  push:
    paths:
      - 'pages/programme/pharmaceutical-evidence-assurance.html'
      - 'pages/programme/pharmaceutical-evidence-assurance.*.structure.xml'
      - 'contracts/pharmaceutical-evidence-assurance-section-contract.xml'
      - 'tools/validate_pharmaceutical_evidence_assurance_contract.py'
      - '.github/workflows/pharmaceutical-evidence-assurance-section-contract.yml'
  pull_request:
    paths:
      - 'pages/programme/pharmaceutical-evidence-assurance.html'
      - 'pages/programme/pharmaceutical-evidence-assurance.*.structure.xml'
      - 'contracts/pharmaceutical-evidence-assurance-section-contract.xml'
      - 'tools/validate_pharmaceutical_evidence_assurance_contract.py'
      - '.github/workflows/pharmaceutical-evidence-assurance-section-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pea-section-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate live ↔ repo section contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deterministic one-page preflight
        run: |
          python tools/validate_pharmaceutical_evidence_assurance_contract.py \
            --repo-root . \
            --check-live \
            --report reports/pea-section-contract-ci.json
      - name: Upload immutable audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pea-section-contract-audit-${{ github.sha }}
          path: reports/pea-section-contract-ci.json
          if-no-files-found: error
          retention-days: 30
