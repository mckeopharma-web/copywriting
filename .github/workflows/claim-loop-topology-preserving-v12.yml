name: Claim loop v1.2 — topology preserving

on:
  push:
    branches:
      - recovery/topology-preserving-v1.2-2026-09-03
    paths:
      - 'tools/claim_loop_topology_preserving_v12.py'
      - '.github/workflows/claim-loop-topology-preserving-v12.yml'
      - '**/*.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: claim-loop-v12-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply topology-preserving NeoFort loop
        run: python tools/claim_loop_topology_preserving_v12.py
      - name: Verify no destructive replacement occurred
        shell: bash
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          failures=[]
          for p in sorted(Path('.').rglob('*.html')):
              s=p.read_text(encoding='utf-8')
              if 'CLAIM_LOOP_UPGRADE_BEGIN' in s or 'claim-loop-seed-archive' in s or 'class="claim-loop-page"' in s:
                  failures.append(f'{p}:destructive-v1.1-residue')
              if 'data-claim-loop-version="external-capability-v1.2-topology-preserving"' not in s:
                  failures.append(f'{p}:missing-v1.2-contract')
              if 'id="neofort-claim-loop-contract"' not in s:
                  failures.append(f'{p}:missing-contract-payload')
          report=json.loads(Path('reports/claim-loop-topology-preserving-v12.json').read_text())
          if report['html_total'] != len(list(Path('.').rglob('*.html'))):
              failures.append('report:html-count-mismatch')
          if report['topology_preserved'] is not True:
              failures.append('report:topology-not-preserved')
          if report['body_replacement_forbidden'] is not True:
              failures.append('report:body-replacement-not-forbidden')
          if report['source_section_gate']['pass'] is not True:
              failures.append('report:SouSec-gate-failed')
          if failures:
              raise SystemExit('\n'.join(failures))
          print(f"PASS: {report['html_total']} HTML pages preserved; Sou/Sec > 0.72")
          PY
      - name: Commit non-destructive contract materialisation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'claim-loop-bot'
          git config user.email 'claim-loop-bot@users.noreply.github.com'
          git add -- '*.html' 'reports/claim-loop-topology-preserving-v12.json'
          git commit -m 'feat(copy): materialise topology-preserving NeoFort v1.2 contract'
          git push
