name: Transfer HealthTech artifact

on:
  push:
    paths:
      - '.github/workflows/transfer-healthtech-artifact.yml'

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and verify exact artifact
        shell: bash
        run: |
          set -euo pipefail
          target="expertises/healthtech-product/healthtech-product_lossless-evidence-v1.2_2026-09-02.html"
          mkdir -p "$(dirname "$target")"

          cat .transfer/healthtech/part-* > /tmp/ht.b64
          test "$(wc -c < /tmp/ht.b64)" -eq 127964
          test "$(sha256sum /tmp/ht.b64 | awk '{print $1}')" = "179dbe2212aa9b1e61daac751faf2398ba7953a64e2e98d531f5f3dfd2696a2a"

          base64 -d /tmp/ht.b64 > /tmp/ht.html.gz
          test "$(wc -c < /tmp/ht.html.gz)" -eq 95973
          test "$(sha256sum /tmp/ht.html.gz | awk '{print $1}')" = "c76d5598da2357c73edc192b9b13f01c42a5b4464048eedcddc2e489017350c3"

          gzip -dc /tmp/ht.html.gz > "$target"
          test "$(wc -c < "$target")" -eq 538992
          test "$(sha256sum "$target" | awk '{print $1}')" = "9fa9aaed8a32cba7c037e2354c67ecadf3aa69316f4d04d15fd1f08d0dd2753c"

          rm -rf .transfer/healthtech
          rm -f .github/workflows/transfer-healthtech-artifact.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(healthtech): add lossless claim-span evidence placement v1.2"
          git push origin HEAD:main
