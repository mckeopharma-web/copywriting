name: parcours-section-contract

on:
  push:
    branches: [main]
    paths:
      - 'pages/parcours/**'
      - 'scripts/validate_parcours_section_contract.py'
      - '.github/workflows/parcours-section-contract.yml'
  pull_request:
    paths:
      - 'pages/parcours/**'
      - 'scripts/validate_parcours_section_contract.py'
      - '.github/workflows/parcours-section-contract.yml'

permissions:
  contents: read

jobs:
  validate-parcours-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate live-locked /parcours/ contract
        run: python scripts/validate_parcours_section_contract.py
