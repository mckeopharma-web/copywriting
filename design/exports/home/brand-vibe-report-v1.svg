<rect x="42" y="205" width="710" height="265" rx="18" class="p"/><text x="68" y="245" class="k">01 · EMOTIONAL CORE</text><text x="68" y="305" class="big">CONTROLLED COMPETENCE</text><text x="68" y="345" class="b">Rendre la complexité inspectable, bornée et reprise en main.</text><text x="68" y="397" class="s">uncertainty → explicit structure → evidence → controlled confidence</text><g transform="translate(70 425)"><circle cx="10" cy="0" r="6" fill="#58d7e7"/><text x="26" y="6" class="s">preuve</text><circle cx="150" cy="0" r="6" fill="#58d7e7"/><text x="166" y="6" class="s">traçabilité</text><circle cx="325" cy="0" r="6" fill="#8b7cff"/><text x="341" y="6" class="s">réversibilité</text><circle cx="500" cy="0" r="6" fill="#6de0a1"/><text x="516" y="6" class="s">production</text></g>
