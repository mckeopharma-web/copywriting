<rect x="42" y="495" width="710" height="420" rx="18" class="p"/><text x="68" y="535" class="k">03 · CLIENT INNER WORLD</text><rect x="68" y="565" width="658" height="92" rx="12" class="chip"/><text x="88" y="595" class="h2">CTO / Head of AI Platform</text><text x="88" y="625" class="s">Demo works; runtime ownership is unclear.</text><text x="584" y="625" class="s">→ CONTROL</text><rect x="68" y="675" width="658" height="92" rx="12" class="chip"/><text x="88" y="705" class="h2">Quality / CSV</text><text x="88" y="735" class="s">Evidence is reconstructed after the fact.</text><text x="550" y="735" class="s">→ DEFENSIBILITY</text><rect x="68" y="785" width="658" height="92" rx="12" class="chip"/><text x="88" y="815" class="h2">AI transformation / training</text><text x="88" y="845" class="s">Use exists; organizational capability is not observable.</text><text x="585" y="845" class="s">→ TRANSFER</text><text x="68" y="896" class="s">Shared job: turn invisible operational debt into an inspectable, ownable system.</text>
<rect x="777" y="495" width="381" height="420" rx="18" class="p"/><text x="803" y="535" class="k">04 · FOUNDER ENERGY</text><circle cx="968" cy="690" r="112" fill="none" stroke="#263247" stroke-dasharray="7 7"/><circle cx="968" cy="615" r="42" fill="#111823" stroke="#58d7e7" stroke-width="2"/><text x="968" y="623" text-anchor="middle" class="h2">B</text><circle cx="875" cy="755" r="42" fill="#111823" stroke="#58d7e7" stroke-width="2"/><text x="875" y="763" text-anchor="middle" class="h2">A</text><circle cx="1060" cy="755" r="42" fill="#111823" stroke="#8b7cff" stroke-width="2"/><text x="1060" y="763" text-anchor="middle" class="h2">T</text><text x="968" y="681" text-anchor="middle" class="b">Builder</text><text x="968" y="707" text-anchor="middle" class="b">Auditor</text><text x="968" y="733" text-anchor="middle" class="b">Translator</text><text x="803" y="860" class="s">Close to the work · technically literate · accountable.</text>
<rect x="42" y="940" width="540" height="390" rx="18" class="p"/><text x="68" y="980" class="k">05 · VOICE</text><g transform="translate(68 1014)"><rect width="108" height="72" rx="10" class="chip"/><text x="16" y="42" class="h2">Précis</text><rect x="122" width="108" height="72" rx="10" class="chip"/><text x="138" y="42" class="h2">Sobre</text><rect x="244" width="108" height="72" rx="10" class="chip"/><text x="260" y="42" class="h2">Borné</text><rect x="366" width="108" height="72" rx="10" class="chip"/><text x="378" y="42" class="h2">Vérifiable</text></g><text x="68" y="1130" class="h2">Prefer</text><text x="68" y="1160" class="b">cadrer · tracer · vérifier · évaluer · reprendre · auditer</text><text x="68" y="1210" class="h2">Avoid unless evidenced</text><text x="68" y="1240" class="b">révolutionnaire · magique · autonome · garanti · sans risque</text><text x="68" y="1290" class="s">Sentence pattern: subject → mechanism → boundary → outcome.</text>
<rect x="607" y="940" width="551" height="390" rx="18" class="p"/><text x="633" y="980" class="k">06 · VISUAL GRAMMAR</text><text x="633" y="1020" class="h2">Observed homepage palette</text><g transform="translate(650 1055)"><circle cx="28" cy="28" r="26" fill="#07090d" stroke="#a7b1c2"/><circle cx="110" cy="28" r="26" fill="#263247"/><circle cx="192" cy="28" r="26" fill="#58d7e7"/><circle cx="274" cy="28" r="26" fill="#8b7cff"/><circle cx="356" cy="28" r="26" fill="#6de0a1"/></g><text x="633" y="1145" class="s">#07090d · #263247 · #58d7e7 · #8b7cff · #6de0a1</text><text x="633" y="1195" class="h2">Interface grammar</text><text x="633" y="1225" class="b">Thin structural lines · evidence chips · bounded charts</text><text x="633" y="1255" class="b">proof-ring · pulse-line · shield-orbit · data-stream</text><text x="633" y="1295" class="s">Visual metaphor: a decision control room, not AI theater.</text>
<rect x="42" y="1355" width="1116" height="345" rx="18" class="p"/><text x="68" y="1395" class="k">07 · DECISION COMPASS</text><circle cx="600" cy="1530" r="92" fill="#0b1420" stroke="url(#g)" stroke-width="4"/><text x="600" y="1518" text-anchor="middle" class="h2">Can this be</text><text x="600" y="1547" text-anchor="middle" class="h2">produced, audited</text><text x="600" y="1576" text-anchor="middle" class="h2">and defended?</text><rect x="150" y="1465" width="260" height="54" rx="10" class="chip"/><text x="280" y="1499" text-anchor="middle" class="b">Execution evidence</text><line x1="410" y1="1492" x2="508" y2="1515" stroke="#58d7e7" stroke-width="2"/><rect x="150" y="1555" width="260" height="54" rx="10" class="chip"/><text x="280" y="1589" text-anchor="middle" class="b">Security + rollback</text><line x1="410" y1="1582" x2="516" y2="1553" stroke="#58d7e7" stroke-width="2"/><rect x="790" y="1465" width="260" height="54" rx="10" class="chip"/><text x="920" y="1499" text-anchor="middle" class="b">Permissions + handoff</text><line x1="790" y1="1492" x2="692" y2="1515" stroke="#8b7cff" stroke-width="2"/><rect x="790" y="1555" width="260" height="54" rx="10" class="chip"/><text x="920" y="1589" text-anchor="middle" class="b">Lineage + evaluation</text><line x1="790" y1="1582" x2="684" y2="1553" stroke="#8b7cff" stroke-width="2"/><text x="68" y="1670" class="s">Filter every initiative through: decision · boundary · inspectability · evidence · human owner · reversibility · mechanism.</text>
